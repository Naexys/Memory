<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <script defer src="JS/script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="min-vh-100 d-flex flex-column">
    <main class="flex-grox-1">
        <div class="card col-10 my-3 offset-1 col-md-4 offset-md-4">
            <div class="card-body p-3">
                <h1 class="card-title text-center">
                    <strong>Memory</strong>
                </h1>
                <p class="card-text">Moves : <span id="moves" class="badge text-bg-primary">0</span></p>
                <p class="card-text">Time : <span id="timerDisplay" class="badge text-bg-primary">00:00</span></p>
                <div id="game-board" class="container card mb-3 border border-primary border-3">
                </div>
                <p id="result" class="card-text"></p>
            </div>
            <div class="card-footer">
                <button id="restart" class="btn btn-outline-primary">Restart</button>
            </div>
        </div>
    </main>
    <footer class="bd-footer mt-auto">
        <div class="col-12 col-md-2 offset-md-5 d-flex justify-content-center">
            <p class=" mb-0">Made by <a href="https://github.com/Naexys">Naexys</a>
                <a href="https://github.com/Naexys/Memory" class="ms-2">
                    <img src="Images/GitHub_Invertocat_White.svg" style="height: 1em; width: auto;"
                        alt="GitHub repository">
                </a>
            </p>
        </div>
    </footer>
</body>

</html>
